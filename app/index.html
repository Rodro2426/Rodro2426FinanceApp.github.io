<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6f2ee">
  <!-- Which appearance the page uses. iOS colors the status bar (time, battery) from this, so it follows the
       app's Light/Dark setting instead of the phone's. Updated by the app when the setting changes. -->
  <meta name="color-scheme" content="light">
  <script>
    // Apply light/dark before anything paints, so a dark-mode app never flashes white and the status bar matches.
    try {
      var t = localStorage.getItem('pockets-theme'); if (t === 'system' || !t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', t);
      var bg = JSON.parse(localStorage.getItem('pockets-bg') || '{}')[t];
      if (bg) document.documentElement.style.setProperty('--page', bg);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bg || (t === 'dark' ? '#0b1d1b' : '#e6f2ee'));
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pockets">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-full.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>Pockets</title>
</head>
<body>
  <script>
    // Coming back from a restart (lib/restart.ts): draw the same loading screen and message right away, so the
    // blank moment while the app loads doesn't flash. The app's own loading screen replaces it (ui/ArrivalVeil.tsx).
    try {
      var back = JSON.parse(sessionStorage.getItem('pockets-return') || 'null');
      if (back && back.text) {
        var el = document.createElement('div'); el.id = 'restart-splash'; el.setAttribute('role', 'status');
        el.style.cssText = 'position:fixed;inset:0;z-index:1001;background:var(--page,' + (document.documentElement.dataset.theme === 'dark' ? '#0b1d1b' : '#e6f2ee') + ');display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px';
        var img = document.createElement('img'); img.src = './pockets-mark.svg'; img.alt = ''; img.width = 64; img.height = 64; img.className = 'arrive-mark';
        var tx = document.createElement('span'); tx.textContent = back.text; tx.setAttribute('translate', 'no');
        tx.style.cssText = 'font-family:var(--font-body,-apple-system,system-ui,sans-serif);font-size:15px;font-weight:600;color:var(--color-neutral-600,' + (document.documentElement.dataset.theme === 'dark' ? '#9c9791' : '#7d7979') + ')';
        el.appendChild(img); el.appendChild(tx); document.body.appendChild(el);
      }
    } catch (e) {}
  </script>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
