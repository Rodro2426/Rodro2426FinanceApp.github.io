<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f3">
  <!-- Which appearance the page uses. iOS colors the status bar (time, battery) from this, so it follows the
       app's Light/Dark setting instead of the phone's. Updated by the app when the setting changes. -->
  <meta name="color-scheme" content="light">
  <script>
    // Apply light/dark before anything paints, so a dark-mode app never flashes white and the status bar matches.
    try {
      var t = localStorage.getItem('pockets-theme'); if (t === 'system' || !t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', t);
      var bg = JSON.parse(localStorage.getItem('pockets-bg') || '{}')[t];
      if (bg) document.documentElement.style.setProperty('--page', bg);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bg || (t === 'dark' ? '#0e0e0d' : '#f7f5f3'));
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pockets">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-full.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>Pockets</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
